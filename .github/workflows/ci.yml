name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The installer is piped into sh on operator machines, so a syntax error
      # would break every install. Cheap to check, expensive to miss.
      - name: Check installer syntax
        run: sh -n install/install.sh

      # Windows PowerShell 5.1 -- still the default on Windows 10 and 11 -- reads
      # a BOM-less .ps1 as Windows-1252, so a UTF-8 em dash arrives as three
      # bytes and breaks the string it sits inside. The first operator to run
      # install.ps1 got nine parse errors from two em dashes and an ellipsis,
      # none of which pointed at the real cause. PowerShell 7 parses the same
      # file cleanly, so this cannot be caught by parsing it.
      - name: Installer must be pure ASCII
        run: |
          if LC_ALL=C grep -n '[^[:print:][:space:]]' install/install.ps1; then
            echo "::error::install/install.ps1 contains non-ASCII bytes (lines above)."
            echo "Windows PowerShell 5.1 reads it as Windows-1252 and the parse breaks."
            exit 1
          fi
          echo "install.ps1 is ASCII-only"

      # Proves the four platforms still cross-compile. The key here is a
      # placeholder and the artifacts are discarded — shippable builds come from
      # the release workflow, which uses the real key.
      - name: Cross-compile
        env:
          MANIFEST_PUBKEY: ci-placeholder-not-a-real-key
        run: make release
